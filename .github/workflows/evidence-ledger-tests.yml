name: Evidence Ledger Tests

on:
  push:
    branches: [main, "feat/crjs355-evidence-ledger"]
    paths:
      - "evidence-ledger/**"
      - ".github/workflows/evidence-ledger-tests.yml"
  pull_request:
    paths:
      - "evidence-ledger/**"
      - ".github/workflows/evidence-ledger-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evidence-ledger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile core, API, demo, and tests
        run: python -m compileall -q .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
